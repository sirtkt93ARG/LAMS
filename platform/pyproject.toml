[project]
name = "matheval"
version = "0.7.0"
description = "Motor de evaluación adaptativa de matemática: ítems por plantillas, QTI 3, IRT/CAT/MST, xAPI"
requires-python = ">=3.11"
dependencies = ["sympy>=1.12", "numpy>=1.26", "scipy>=1.11", "lxml>=5.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "PyJWT[crypto]>=2.8", "psycopg[binary]>=3.1", "httpx>=0.27"]
lti = ["flask>=3.0", "flask-caching>=2.1", "PyLTI1p3>=2.0", "PyJWT[crypto]>=2.8", "requests>=2.31"]
microdata = ["duckdb>=1.0", "pandas>=2.0", "pyreadstat>=1.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

name: Continuous integration

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,lti,dev,microdata]"
      - name: Compile Python modules
        run: python -m compileall -q src api lti_service tools scripts
      - name: Validate development launcher syntax
        run: bash -n scripts/dev.sh
      - name: Rebuild and validate generated content
        run: |
          python scripts/generate_bank.py
          python scripts/validate_bank.py
          python scripts/validate_observatory.py
      - name: Run automated tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Test frontend libraries
        run: npm run test:lib
      - name: Build frontend
        env:
          NEXT_PUBLIC_DEV: "1"
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: matheval_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matheval_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/pyproject.toml
      - name: Install API and test dependencies
        working-directory: platform
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Verify PostgreSQL migrations, RLS, and store operations
        working-directory: platform
        env:
          MATHEVAL_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/matheval_test
          MATHEVAL_TEST_POSTGRES_URL: postgresql://matheval_app:cambiar-en-produccion@localhost:5432/matheval_test
        run: python -m pytest -q tests/test_postgres_integration.py

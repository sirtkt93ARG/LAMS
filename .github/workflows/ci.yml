name: Continuous integration

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,lti,dev,microdata]"
      - name: Compile Python modules
        run: python -m compileall -q src api lti_service tools scripts
      - name: Validate development launcher syntax
        run: bash -n scripts/dev.sh
      - name: Rebuild and validate generated content
        run: |
          python scripts/generate_bank.py
          python scripts/validate_bank.py
          python scripts/validate_observatory.py
      - name: Run automated tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Test frontend libraries
        run: npm run test:lib
      - name: Build frontend
        env:
          NEXT_PUBLIC_DEV: "1"
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: matheval_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matheval_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/pyproject.toml
      - name: Expose PostgreSQL 16 client utilities from the service container
        run: |
          container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n1)"
          test -n "$container"
          echo "MATHEVAL_POSTGRES_CONTAINER=$container" >> "$GITHUB_ENV"
      - name: Install API and test dependencies
        working-directory: platform
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Verify PostgreSQL migrations, RLS, and store operations
        working-directory: platform
        env:
          MATHEVAL_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/matheval_test
          MATHEVAL_TEST_POSTGRES_URL: postgresql://matheval_app:cambiar-en-produccion@localhost:5432/matheval_test
        run: python -m pytest -q tests/test_postgres_integration.py
      - name: Verify PostgreSQL logical backup and restore end to end
        working-directory: platform
        env:
          MATHEVAL_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/matheval_test
        run: python -m pytest -q tests/test_postgres_backup_integration.py

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Compose configuration
        run: |
          docker compose version
          docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build and start the complete local stack
        run: docker compose -f deploy/docker-compose.yml up --build -d
      - name: Diagnose PostgreSQL application grants
        run: |
          docker compose -f deploy/docker-compose.yml exec -T db psql -U postgres -d matheval -v ON_ERROR_STOP=1 -c "SELECT current_database() AS database, rolname, has_table_privilege(rolname, 'public.sessions', 'SELECT') AS can_select, has_table_privilege(rolname, 'public.sessions', 'INSERT') AS can_insert, has_table_privilege(rolname, 'public.sessions', 'UPDATE') AS can_update, has_table_privilege(rolname, 'public.sessions', 'DELETE') AS can_delete FROM pg_roles WHERE rolname = 'matheval_app';" -c "\\dp public.sessions" -c "SELECT policyname, cmd, qual, with_check FROM pg_policies WHERE tablename = 'sessions';"
      - name: Verify Keycloak issuer and full HTTP/LTI journey
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/docker-compose.yml"
          cleanup() {
            code=$?
            if [ "$code" -ne 0 ]; then
              $compose logs --no-color || true
            fi
            $compose down --volumes --remove-orphans || true
            exit "$code"
          }
          trap cleanup EXIT
          wait_for() {
            url="$1"
            for attempt in $(seq 1 90); do
              if curl --silent --fail "$url" >/dev/null; then return 0; fi
              sleep 2
            done
            echo "Servicio no disponible: $url"
            return 1
          }
          wait_for http://localhost:8080/realms/matheval/.well-known/openid-configuration
          python - <<'PY'
          import json
          import urllib.request
          url = "http://localhost:8080/realms/matheval/.well-known/openid-configuration"
          with urllib.request.urlopen(url, timeout=10) as response:
              metadata = json.load(response)
          assert metadata["issuer"] == "http://localhost:8080/realms/matheval", metadata["issuer"]
          PY
          wait_for http://localhost:8000/healthz
          wait_for http://localhost:8200/lti/jwks/
          wait_for http://localhost:8300/jwks
          wait_for http://localhost:3000/
          python scripts/smoke_http.py

  lti-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install real LTI and API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,lti]"
      - name: Generate ephemeral LTI signing keys
        run: python scripts/gen_lti_keys.py
      - name: Install and build web client
        working-directory: platform/web
        env:
          NEXT_PUBLIC_DEV: "1"
        run: |
          npm install
          npm run build
      - name: Install Chromium for browser tests
        working-directory: platform/web
        run: npx playwright install --with-deps chromium
      - name: Start API, real PyLTI1p3 service, mock LMS, and web
        env:
          MATHEVAL_DEV: "1"
          SESSION_SECRET: "ci-session-secret-0123456789abcdef0123456789abcdef"
          LTI_HANDOFF_SECRET: "ci-handoff-secret-0123456789abcdef0123456789"
          LTI_SECRET_KEY: "ci-flask-secret-0123456789abcdef0123456789"
          PSEUDONYM_SECRET: "ci-pseudonym-secret-0123456789abcdef0123456789"
          DATABASE_URL: "sqlite:///data/matheval-smoke.db"
          WEB_ORIGIN: "http://localhost:3000"
          LTI_CONFIG: "lti_service/configs/lti.mock.json"
          WEB_URL: "http://localhost:3000"
          TOOL_BASE: "http://localhost:8200"
          LTI_SERVICE_URL: "http://localhost:8200"
          NEXT_PUBLIC_DEV: "1"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          python -m uvicorn api.app.main:app --host 127.0.0.1 --port 8000 > /tmp/lams-api.log 2>&1 &
          API_PID=$!
          python -m flask --app lti_service.app run --host 127.0.0.1 --port 8200 > /tmp/lams-lti.log 2>&1 &
          LTI_PID=$!
          python -m flask --app tools.mock_lms.app run --host 127.0.0.1 --port 8300 > /tmp/lams-lms.log 2>&1 &
          LMS_PID=$!
          mkdir -p web/.next/standalone/.next
          cp -R web/.next/static web/.next/standalone/.next/static
          if [ -d web/public ]; then cp -R web/public web/.next/standalone/public; fi
          (cd web/.next/standalone && PORT=3000 HOSTNAME=127.0.0.1 node server.js) > /tmp/lams-web.log 2>&1 &
          WEB_PID=$!

          cleanup() {
            code=$?
            kill "$API_PID" "$LTI_PID" "$LMS_PID" "$WEB_PID" 2>/dev/null || true
            if [ "$code" -ne 0 ]; then
              echo "===== API ====="; tail -n 160 /tmp/lams-api.log || true
              echo "===== LTI ====="; tail -n 160 /tmp/lams-lti.log || true
              echo "===== MOCK LMS ====="; tail -n 160 /tmp/lams-lms.log || true
              echo "===== WEB ====="; tail -n 160 /tmp/lams-web.log || true
            fi
            exit "$code"
          }
          trap cleanup EXIT

          wait_for() {
            url="$1"
            for attempt in $(seq 1 60); do
              if curl --silent --fail "$url" >/dev/null; then return 0; fi
              sleep 2
            done
            echo "Servicio no disponible: $url"
            return 1
          }
          wait_for http://localhost:8000/healthz
          wait_for http://localhost:8200/lti/jwks/
          wait_for http://localhost:8300/
          wait_for http://localhost:3000/
          python scripts/smoke_http.py
          (cd web && npm run test:e2e)
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-traces
          path: platform/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

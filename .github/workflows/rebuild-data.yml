name: Rebuild project data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-data.yml"
      - "platform/src/matheval/templates.py"
      - "platform/scripts/generate_bank.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        working-directory: platform
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Rebuild generated data
        working-directory: platform
        run: |
          python scripts/generate_bank.py
          python scripts/build_observatory_data.py
          python scripts/validate_observatory.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/data
          if git diff --cached --quiet; then
            echo "Generated data already matches repository."
            exit 0
          fi
          git commit -m "Restore generated project data"
          git push
